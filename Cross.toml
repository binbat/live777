# Cross-rs configuration for live777 native backends.
#
# Usage example (Raspberry Pi libcamera / V4L2):
#   export RPI_SYSROOT=/path/to/rpi-sysroot
#   cross build --target aarch64-unknown-linux-gnu \
#     --bin live777 --release \
#     --no-default-features --features native-rpi,webui
#
# The RPI_SYSROOT directory is mounted into the container at the same path.
# livehal/build.rs reads RPI_SYSROOT to set pkg-config sysroot and link paths.

[target.aarch64-unknown-linux-gnu]
# The default aarch64 image stays generic. Rockchip RKMPP (RK3588, RV1126B)
# builds should override the target image with
# CROSS_TARGET_AARCH64_UNKNOWN_LINUX_GNU_IMAGE pointing to
# ghcr.io/binbat/crossbuilder-aarch64-rkmpp:latest, which has the Rockchip
# MPP sysroot baked at /opt/rkmpp-sysroot (the stock cross image is Ubuntu
# 20.04, glibc 2.31, too old to link librockchip_mpp.so). For local builds,
# RK_MPP_SYSROOT can still point to a sysroot pulled from a device; cross
# mounts it into the container at the same path and livehal/build.rs reads
# it to configure the library search path.
image = "ghcr.io/cross-rs/aarch64-unknown-linux-gnu:main"

[target.aarch64-unknown-linux-gnu.env]
volumes = ["RPI_SYSROOT", "RK_MPP_SYSROOT"]

[target.armv7-unknown-linux-gnueabihf]
image = "ghcr.io/cross-rs/armv7-unknown-linux-gnueabihf:main"

[target.armv7-unknown-linux-gnueabihf.env]
volumes = ["RPI_SYSROOT"]
