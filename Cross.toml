# Cross-rs configuration for live777 native backends.
#
# Usage example (Raspberry Pi libcamera / V4L2):
#   export PI_SYSROOT=/path/to/pi-sysroot
#   cross build --target aarch64-unknown-linux-gnu \
#     --bin live777 --release \
#     --no-default-features --features native-rpi,webui
#
# The PI_SYSROOT directory is mounted into the container at the same path.
# livehal/build.rs reads PI_SYSROOT to set pkg-config sysroot and link paths.

[target.aarch64-unknown-linux-gnu]
# Custom Debian 13 (trixie, glibc 2.41) image matching the Luckfox Aura
# target rootfs exactly — no glibc-version variables. The stock cross image
# is Ubuntu 20.04 (glibc 2.31) and cannot link board-provided
# librockchip_mpp.so (needs GLIBC_2.34+). Ubuntu 22.04 (glibc 2.35,
# docker/Dockerfile.cross-aarch64-u2204) is the lower-baseline alternative
# for older rootfs (e.g. the Luckfox buildroot image, glibc but older).
# Build it with:
#   docker build -f docker/Dockerfile.cross-aarch64-debian13 \
#     -t live777-cross-aarch64-debian13:local .
image = "ghcr.io/binbat/live777-cross-aarch64-u2204:latest"

[target.aarch64-unknown-linux-gnu.env]
volumes = ["PI_SYSROOT", "RK_MPP_SYSROOT"]

[target.armv7-unknown-linux-gnueabihf]
image = "ghcr.io/cross-rs/armv7-unknown-linux-gnueabihf:main"

[target.armv7-unknown-linux-gnueabihf.env]
volumes = ["PI_SYSROOT"]
