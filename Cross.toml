# Cross-rs configuration for live777 native backends.
#
# Usage example (Raspberry Pi libcamera / V4L2):
#   export RPI_SYSROOT=/path/to/rpi-sysroot
#   cross build --target aarch64-unknown-linux-gnu \
#     --bin live777 --release \
#     --no-default-features --features native-rpi,webui
#
# The default aarch64 image stays generic. Raspberry Pi builds should override
# the target image with CROSS_TARGET_AARCH64_UNKNOWN_LINUX_GNU_IMAGE pointing
# to ghcr.io/binbat/crossbuilder-aarch64-rpi:latest, which has a libcamera
# sysroot baked at /opt/rpi-sysroot. For local builds, RPI_SYSROOT can still
# point to a Raspberry Pi sysroot copied from a target device; cross mounts it
# into the container at the same path and livehal/build.rs reads it to configure
# pkg-config and linker paths.

[target.aarch64-unknown-linux-gnu]
image = "ghcr.io/cross-rs/aarch64-unknown-linux-gnu:main"

[target.aarch64-unknown-linux-gnu.env]
volumes = ["RPI_SYSROOT"]

[target.armv7-unknown-linux-gnueabihf]
image = "ghcr.io/cross-rs/armv7-unknown-linux-gnueabihf:main"

[target.armv7-unknown-linux-gnueabihf.env]
volumes = ["RPI_SYSROOT"]
