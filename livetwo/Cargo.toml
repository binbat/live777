[package]
name = "livetwo"
description = "WHIP/WHEP convert RTP/RTSP tool"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
crate-type = ["lib"]

[dependencies]
cli = { path = "../libs/cli" }
rtsp = { path = "../libs/rtsp", default-features = false, features = ["client"] }
libwish = { path = "../libs/libwish" }
api = { path = "../libs/api" }
iceserver = { path = "../libs/iceserver" }

anyhow = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
webrtc = { workspace = true }
rtc = { workspace = true }
sdp = { workspace = true }
url = { workspace = true }
base64 = { workspace = true }
serde = { workspace = true, features = ["derive"] }
async-trait = { workspace = true }
tempfile = { workspace = true }

bytes = "1.6.0"
scopeguard = "1.2.0"
portpicker = "0.1.1"
sdp-types = "0.1"
rand = "0.10"
rtc-rtcp = { workspace = true }
rtc-shared = { workspace = true }

rsmpeg = { version = "0.18", features = ["link_system_ffmpeg"], optional = true }
socket2 = { version = "0.6", optional = true }

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

[features]
# Multicast-aware UDP socket builders (transport::multicast), used by
# liveion's SDP file source and rtp:// output target, and by whepfrom's
# rtp://group:port output (always on in the root crate's livetwo dependency)
multicast = ["dep:socket2", "dep:libc"]
rsmpeg = ["dep:rsmpeg"]
