# Cloud central SFU node. Receives cascaded streams from the edge nodes and
# serves any number of viewers (no [[nodes]] sub_max entry = unlimited).
[http]
listen = "127.0.0.1:7782"

[strategy]
# Primary teardown for cascaded streams: shortly after the last viewer
# leaves, destroy the stream. This also ends the cloud's outgoing WHEP pull
# (the edge's inbound subscriber session), so the edge returns to zero
# outbound copies and the next viewer goes direct to the edge again.
auto_delete_whep = 5000
# Do NOT set a small auto_delete_whip here: that reaper destroys the stream
# once the publisher has been gone for the timeout, regardless of attached
# viewers, and rebuilding a supervised pull hop after a transient failure
# routinely takes longer — every cloud viewer would be dropped.
