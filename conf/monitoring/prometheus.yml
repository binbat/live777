# Prometheus scrape configuration for live777.
#
# live777 serves Prometheus metrics at `GET /metrics` on its HTTP port
# (default 7777). The endpoint is always compiled in — no cargo feature or
# config flag is needed.

global:
    scrape_interval: 5s
    evaluation_interval: 5s

scrape_configs:
    - job_name: live777
      # live777 running on the Docker host. On Linux this works because
      # compose.monitoring.yml maps host.docker.internal to the host gateway.
      static_configs:
          - targets:
                - host.docker.internal:7777

    # Cluster example: list every live777 node, or use service discovery.
    # (liveman has no Prometheus endpoint; scrape the live777 nodes directly.)
    # - job_name: live777-cluster
    #   static_configs:
    #       - targets:
    #             - live777-0:7777
    #             - live777-1:7777
    #             - live777-2:7777
