name: Docker Images

on:
  push:
    branches:
      - docker
    tags:
      - 'v*'

jobs:
  docker:
    name: Docker Images (${{ matrix.app }})
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        app:
          - ffmpeg
          - gstreamer
          - live777-client
          - live777-server
          - liveion
          - liveman
          - net4mqtt
          - whipinto
          - whepfrom
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Full history so `git describe` can see tags; the Docker build
          # context excludes .git, so the version is passed in as a build-arg.
          fetch-depth: 0
      - name: Version
        id: version
        run: echo "version=$(git describe --tags --always)" >> "$GITHUB_OUTPUT"
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/binbat/${{ matrix.app }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
          flavor: |
            latest=auto
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          file: docker/Dockerfile.${{ matrix.app }}
          platforms: linux/amd64,linux/arm64
          build-args: |
            LIVE777_VERSION=${{ steps.version.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  live777-all:
    name: live777-all (linux/${{ matrix.arch }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        arch:
          - amd64
          - arm64
    env:
      TEST_IMAGE: ghcr.io/binbat/live777-all:test-${{ github.run_id }}-${{ matrix.arch }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Version
        id: version
        run: echo "version=$(git describe --tags --always)" >> "$GITHUB_OUTPUT"
      - name: Docker meta for tested architecture tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/binbat/live777-all
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
          flavor: |
            latest=auto
            suffix=-${{ matrix.arch }}
            onlatest=true
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and load final image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.live777-all
          platforms: linux/${{ matrix.arch }}
          load: true
          push: false
          build-args: |
            LIVE777_VERSION=${{ steps.version.outputs.version }}
          tags: ${{ env.TEST_IMAGE }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Smoke test final image
        run: docker run --rm --network host "${TEST_IMAGE}" smoke-test --standalone
      - name: Push tested architecture tags
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          ARCH_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            [ -n "${tag}" ] || continue
            docker tag "${TEST_IMAGE}" "${tag}"
            docker push "${tag}"
          done < <(printf '%s\n' "${ARCH_TAGS}")

  live777-all-manifest:
    name: live777-all (manifest)
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - live777-all
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/binbat/live777-all
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
          flavor: |
            latest=auto
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish manifests from tested architecture tags
        shell: bash
        env:
          RELEASE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            [ -n "${tag}" ] || continue
            docker buildx imagetools create --tag "${tag}" "${tag}-amd64" "${tag}-arm64"
          done < <(printf '%s\n' "${RELEASE_TAGS}")

