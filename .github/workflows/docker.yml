name: Docker Images

on:
  push:
    branches:
      - docker
    tags:
      - 'v*'
  pull_request:
    paths:
      - '.github/workflows/docker.yml'
      - '.dockerignore'
      - 'docker/**'
      - 'scripts/docker-smoke.sh'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'package.json'
      - 'pnpm-lock.yaml'

jobs:
  docker:
    name: Docker Images (${{ matrix.app }} / linux/${{ matrix.arch }})
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-26.04-arm' || 'ubuntu-26.04' }}
    strategy:
      fail-fast: false
      matrix:
        app:
          - ffmpeg
          - gstreamer
          - live777-client
          - live777-server
          - liveion
          - liveman
          - net4mqtt
          - whipinto
          - whepfrom
          - live777-all
        arch:
          - amd64
          - arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Full history so `git describe` can see tags; the Docker build
          # context excludes .git, so the version is passed in as a build-arg.
          fetch-depth: 0
      - name: Version
        id: version
        run: echo "version=$(git describe --tags --always)" >> "$GITHUB_OUTPUT"
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/binbat/${{ matrix.app }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
          flavor: |
            latest=auto
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to GitHub Container Registry
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build final image once
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.${{ matrix.app }}
          platforms: linux/${{ matrix.arch }}
          outputs: |
            type=docker,dest=${{ runner.temp }}/${{ matrix.app }}-${{ matrix.arch }}.tar,name=local/${{ matrix.app }}:test
            ${{ startsWith(github.ref, 'refs/tags/') && format('type=image,name=ghcr.io/binbat/{0},push=true,push-by-digest=true', matrix.app) || '' }}
          build-args: |
            LIVE777_VERSION=${{ steps.version.outputs.version }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Load final image
        run: docker load --input "${{ runner.temp }}/${{ matrix.app }}-${{ matrix.arch }}.tar"
      - name: Smoke test final image
        run: bash scripts/docker-smoke.sh "${{ matrix.app }}" "local/${{ matrix.app }}:test"
      - name: Save tested image digest
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: printf '%s\n' 'ghcr.io/binbat/${{ matrix.app }}@${{ steps.build.outputs.digest }}' > digest.txt
      - name: Upload tested image digest
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.app }}-digest-${{ matrix.arch }}
          path: digest.txt
          if-no-files-found: error

  docker-manifest:
    name: Docker Manifests
    if: startsWith(github.ref, 'refs/tags/')
    needs: docker
    runs-on: ubuntu-26.04
    steps:
      - name: Download tested image digests
        uses: actions/download-artifact@v7
        with:
          pattern: '*-digest-*'
          path: digests
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/binbat/live777
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
          flavor: |
            latest=auto
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish manifests from tested image digests
        shell: bash
        env:
          RELEASE_TAGS: ${{ steps.meta.outputs.tag-names }}
        run: |
          set -euo pipefail
          for amd64_file in digests/*-digest-amd64/digest.txt; do
            [ -f "${amd64_file}" ] || { echo "No tested image digests found"; exit 1; }
            app_dir=${amd64_file%/digest.txt}
            app=${app_dir##*/}
            app=${app%-digest-amd64}
            arm64_file="digests/${app}-digest-arm64/digest.txt"
            [ -f "${arm64_file}" ] || { echo "Missing arm64 digest for ${app}"; exit 1; }
            amd64_digest=$(<"${amd64_file}")
            arm64_digest=$(<"${arm64_file}")
            [ -n "${amd64_digest}" ] && [ -n "${arm64_digest}" ]
            while IFS= read -r tag; do
              [ -n "${tag}" ] || continue
              docker buildx imagetools create \
                --tag "ghcr.io/binbat/${app}:${tag}" "${amd64_digest}" "${arm64_digest}"
            done < <(printf '%s\n' "${RELEASE_TAGS}")
          done
