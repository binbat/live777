name: Release

on:
  push:
    branches:
      - test
  release:
    types:
      - 'published'
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - '.github/actions/install-ffmpeg/**'
      - '.github/actions/release-version/**'
      - '.github/vcpkg-overlays/**'
      - 'docker/Dockerfile.diagnostics-musl'
      - 'docker/smoke-test.sh'
      - 'scripts/package-diagnostics*'
      - 'licenses/diagnostics/**'
      - 'Cargo.toml'
      - 'Cargo.lock'

jobs:
  build:
    if: github.event_name != 'pull_request'
    name: ${{ matrix.job.target }} (${{ matrix.job.os }})
    runs-on: ${{ matrix.job.os }}
    strategy:
      fail-fast: false
      matrix:
        job:
          # https://doc.rust-lang.org/nightly/rustc/platform-support.html
          - { target: aarch64-apple-darwin        , os: macos-15                      }
          - { target: aarch64-pc-windows-msvc     , os: windows-2025                  }
          - { target: aarch64-linux-android       , os: ubuntu-24.04, use-cross: true }
          - { target: aarch64-unknown-linux-gnu   , os: ubuntu-24.04, use-cross: true }
          - { target: aarch64-unknown-linux-musl  , os: ubuntu-24.04, use-cross: true, nfpm: arm64 }
          - { target: arm-unknown-linux-gnueabihf , os: ubuntu-24.04, use-cross: true }
          - { target: arm-unknown-linux-musleabihf, os: ubuntu-24.04, use-cross: true }
          - { target: i686-pc-windows-msvc        , os: windows-2025                  }
          - { target: i686-unknown-linux-gnu      , os: ubuntu-24.04, use-cross: true }
          - { target: i686-unknown-linux-musl     , os: ubuntu-24.04, use-cross: true }
          - { target: riscv64gc-unknown-linux-gnu , os: ubuntu-24.04, use-cross: true }
          - { target: riscv64gc-unknown-linux-musl, os: ubuntu-24.04, use-cross: true, nfpm: riscv64 }
          - { target: x86_64-apple-darwin         , os: macos-15                      }
          - { target: x86_64-pc-windows-gnu       , os: windows-2025                  }
          - { target: x86_64-pc-windows-msvc      , os: windows-2025                  }
          - { target: x86_64-unknown-linux-gnu    , os: ubuntu-24.04, use-cross: true }
          - { target: x86_64-unknown-linux-musl   , os: ubuntu-24.04, use-cross: true, nfpm: amd64 }
    env:
      BUILD_CMD: cargo
      EXE_SUFFIX: ""
      PKG_LIVE777_NAME: ""
      PKG_LIVEMAN_NAME: ""
      PKG_WHEPFROM_NAME: ""
      PKG_WHIPINTO_NAME: ""
    steps:
      - name: Checkout source code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Build WebUI
        uses: ./.github/actions/build-webui

      - name: Get the release version from the tag
        uses: ./.github/actions/release-version

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.job.target }}

      - name: Install cross
        if: matrix.job.use-cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Overwrite build command env variable
        if: matrix.job.use-cross
        shell: bash
        run: echo "BUILD_CMD=cross" >> $GITHUB_ENV

      - name: Overwrite suffix env variable
        if: runner.os == 'Windows'
        shell: bash
        run: echo "EXE_SUFFIX=.exe" >> $GITHUB_ENV

      - name: Show version information (Rust, cargo, GCC)
        shell: bash
        run: |
          gcc --version || true
          cross --version || true
          rustup -V
          rustup toolchain list
          rustup default
          cargo -V
          rustc -V
          echo "BUILD_CMD: ${BUILD_CMD}"

      - name: Build
        shell: bash
        run: |
          # The general release matrix stays unchanged; rsmpeg tools and their
          # dynamic FFmpeg runtime are packaged by build-diagnostics on native
          # runners because the cross-compilation images lack FFmpeg dev libs.
          $BUILD_CMD $BUILD_NDK build --locked --all-targets \
            --features source-all,webui,net4mqtt,recorder,cascade,whepwright,target-whip,target-rtp,target-rtsp,rtsp \
            --release --target=${{ matrix.job.target }}

      - name: Archive
        shell: bash
        run: |
          PKG_BUILDNAME=${{ env.VERSION }}-${{ matrix.job.target }}${{ env.EXE_SUFFIX }}
          echo "BUILD_PATH=target/${{ matrix.job.target }}/release" >> $GITHUB_ENV
          echo "PKG_LIVE777_NAME=live777-${PKG_BUILDNAME}" >> $GITHUB_ENV
          echo "PKG_LIVEMAN_NAME=liveman-${PKG_BUILDNAME}" >> $GITHUB_ENV
          echo "PKG_WHEPFROM_NAME=whepfrom-${PKG_BUILDNAME}" >> $GITHUB_ENV
          echo "PKG_WHIPINTO_NAME=whipinto-${PKG_BUILDNAME}" >> $GITHUB_ENV
          echo "PKG_NET4MQTT_NAME=net4mqtt-${PKG_BUILDNAME}" >> $GITHUB_ENV

      - name: Create release archives
        shell: bash
        run: |
          bash scripts/create-release-archive.sh live777 "${{ matrix.job.target }}" "${VERSION}" "${BUILD_PATH}" "${EXE_SUFFIX}"
          bash scripts/create-release-archive.sh liveman "${{ matrix.job.target }}" "${VERSION}" "${BUILD_PATH}" "${EXE_SUFFIX}"

      - name: Rename binary
        shell: bash
        run: |
          cp ${{ env.BUILD_PATH }}/whepfrom${{ env.EXE_SUFFIX }} ${{ env.PKG_WHEPFROM_NAME }}
          cp ${{ env.BUILD_PATH }}/whipinto${{ env.EXE_SUFFIX }} ${{ env.PKG_WHIPINTO_NAME }}
          cp ${{ env.BUILD_PATH }}/net4mqtt${{ env.EXE_SUFFIX }} ${{ env.PKG_NET4MQTT_NAME }}

      - name: Artifact Upload Binary
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.VERSION }}_${{ matrix.job.target }}_bin
          path: |
            ${{ env.TAR_LIVE777_NAME }}
            ${{ env.TAR_LIVEMAN_NAME }}
            ${{ env.PKG_WHEPFROM_NAME }}
            ${{ env.PKG_WHIPINTO_NAME }}
            ${{ env.PKG_NET4MQTT_NAME }}

      - name: Install nFPM
        if: ${{ matrix.job.nfpm }}
        run: |
            echo 'deb [trusted=yes] https://repo.goreleaser.com/apt/ /' | sudo tee /etc/apt/sources.list.d/goreleaser.list
            sudo apt update
            sudo apt install nfpm

      - name: Set nFPM environment
        if: ${{ matrix.job.nfpm }}
        run: |
          DESCRIBE=`git describe --tags`-
          echo "NFPM_NAME=live777" >> $GITHUB_ENV
          echo "NFPM_ARCH=${{ matrix.job.nfpm }}" >> $GITHUB_ENV
          echo "NFPM_TARGET=${{ matrix.job.target }}" >> $GITHUB_ENV
          echo "NFPM_VERSION=`echo ${DESCRIBE} | cut -d - -f 1`" >> $GITHUB_ENV
          echo "NFPM_RELEASE=`echo ${DESCRIBE} | cut -d - -f 2`" >> $GITHUB_ENV
          echo "NFPM_PRERELEASE=`echo ${DESCRIBE} | cut -d - -f 3`" >> $GITHUB_ENV

      - name: Build nFPM config
        if: ${{ matrix.job.nfpm }}
        run: |
          envsubst < nfpm/live777.yaml > live777.yaml
          envsubst < nfpm/liveman.yaml > liveman.yaml
          envsubst < nfpm/net4mqtt.yaml > net4mqtt.yaml
          envsubst < nfpm/whipinto.yaml > whipinto.yaml
          envsubst < nfpm/whepfrom.yaml > whepfrom.yaml

      - name: Use nFPM
        if: ${{ matrix.job.nfpm }}
        run: |
          for package in live777 liveman net4mqtt whipinto whepfrom; do
            for packager in deb rpm archlinux; do
              nfpm pkg --packager "${packager}" --config "${package}.yaml"
            done
          done

      - name: Artifact Upload nFPM packages
        uses: actions/upload-artifact@v7
        if: ${{ matrix.job.nfpm }}
        with:
          name: ${{ env.VERSION }}_${{ matrix.job.target }}_nfpm
          path: |
            *.deb
            *.rpm
            *.pkg.tar.zst

      - name: Upload release archive
        shell: bash
        if: github.ref_type == 'tag'
        run: gh release upload ${{ env.VERSION }} ${{ env.TAR_LIVE777_NAME }} ${{ env.TAR_LIVEMAN_NAME }} ${{ env.PKG_WHEPFROM_NAME }} ${{ env.PKG_WHIPINTO_NAME }} ${{ env.PKG_NET4MQTT_NAME }}
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Upload release archive nFPM package
        shell: bash
        if: ${{ (github.ref_type == 'tag') && (matrix.job.nfpm) }}
        run: gh release upload ${{ env.VERSION }} *.deb *.rpm *.pkg.tar.zst
        env:
          GH_TOKEN: ${{ github.token }}


  build-diagnostics:
    name: diagnostics (${{ matrix.job.target }})
    runs-on: ${{ matrix.job.os }}
    strategy:
      fail-fast: false
      matrix:
        job:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-24.04 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm }
          - { target: x86_64-apple-darwin, os: macos-15-intel }
          - { target: aarch64-apple-darwin, os: macos-15 }
          - { target: x86_64-pc-windows-msvc, os: windows-2025 }
    steps:
      - name: Checkout source code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Get the release version from the tag
        uses: ./.github/actions/release-version

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.job.target }}

      - name: Install LLVM 20 for bindgen (Linux)
        if: runner.os == 'Linux'
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "20"
          directory: ${{ github.workspace }}/clang20

      - name: Expose LLVM 20 to the FFmpeg setup (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          SRC=$(find "${{ github.workspace }}/clang20" -name 'libclang.so*' -type f | head -1)
          [ -n "${SRC}" ] || { echo "ERROR: libclang.so not found"; exit 1; }
          sudo mkdir -p /usr/lib/llvm-20/lib
          sudo ln -sf "${SRC}" /usr/lib/llvm-20/lib/libclang-20.so

      - name: Install FFmpeg for rsmpeg
        uses: ./.github/actions/install-ffmpeg

      - name: Build diagnostics tools
        shell: bash
        env:
          RUSTFLAGS: ${{ runner.os != 'Windows' && format('-L native={0}/ffmpeg-install/lib', github.workspace) || '' }}
        run: >-
          cargo build --locked --release --target=${{ matrix.job.target }}
          --bin=whipsynth --bin=whepprobe --bin=livewrk --features=rsmpeg

      - name: Enable Debian source repositories (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          SOURCES=/etc/apt/sources.list.d/ubuntu.sources
          [ -f "${SOURCES}" ] || { echo "Missing Ubuntu repository definition: ${SOURCES}"; exit 1; }
          sudo sed -i -E 's/^Types: deb$/Types: deb deb-src/' "${SOURCES}"
          grep -q '^Types:.*deb-src' "${SOURCES}"
          sudo apt-get update -qq

      - name: Package and verify diagnostics (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          bash scripts/package-diagnostics.sh package "${{ matrix.job.target }}" "${VERSION}"
          bash scripts/package-diagnostics.sh verify "${{ matrix.job.target }}" "${VERSION}"
          bash scripts/package-diagnostics-sources.sh package "${{ matrix.job.target }}" "${VERSION}"
          bash scripts/package-diagnostics-sources.sh verify "${{ matrix.job.target }}" "${VERSION}"

      - name: Package and verify diagnostics (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/package-diagnostics.ps1 -Mode package -Target "${{ matrix.job.target }}" -Version "${{ env.VERSION }}"
          ./scripts/package-diagnostics.ps1 -Mode verify -Target "${{ matrix.job.target }}" -Version "${{ env.VERSION }}"
          ./scripts/package-diagnostics-sources.ps1 -Mode package -Target "${{ matrix.job.target }}" -Version "${{ env.VERSION }}"
          ./scripts/package-diagnostics-sources.ps1 -Mode verify -Target "${{ matrix.job.target }}" -Version "${{ env.VERSION }}"

      - name: Upload diagnostics release archives
        shell: bash
        if: github.ref_type == 'tag'
        run: |
          ARCHIVE_SUFFIX=tar.gz
          if [ "${RUNNER_OS}" = "Windows" ]; then ARCHIVE_SUFFIX=zip; fi
          gh release upload "${VERSION}" \
            "dist/diagnostics/live777-diagnostics-${VERSION}-${{ matrix.job.target }}.${ARCHIVE_SUFFIX}" \
            "dist/diagnostics/live777-diagnostics-sources-${VERSION}-${{ matrix.job.target }}.${ARCHIVE_SUFFIX}"
        env:
          GH_TOKEN: ${{ github.token }}

  build-diagnostics-musl:
    name: diagnostics musl (${{ matrix.job.target }})
    runs-on: ${{ matrix.job.os }}
    strategy:
      fail-fast: false
      matrix:
        job:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-26.04 }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-26.04-arm }
    steps:
      - name: Checkout source code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Get the release version from the tag
        uses: ./.github/actions/release-version

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and verify static diagnostics bundle
        shell: bash
        run: >-
          docker buildx build -f docker/Dockerfile.diagnostics-musl
          --target export --output type=local,dest=dist/diagnostics
          --build-arg TARGET=${{ matrix.job.target }}
          --build-arg VERSION="${VERSION}" .

      - name: Upload static diagnostics release archives
        shell: bash
        if: github.ref_type == 'tag'
        run: >-
          gh release upload "${VERSION}"
          "dist/diagnostics/live777-diagnostics-${VERSION}-${{ matrix.job.target }}.tar.gz"
          "dist/diagnostics/live777-diagnostics-sources-${VERSION}-${{ matrix.job.target }}.tar.gz"
        env:
          GH_TOKEN: ${{ github.token }}

  build-native:
    if: github.event_name != 'pull_request'
    name: aarch64-unknown-linux-gnu-${{ matrix.job.variant }} (ubuntu-24.04)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        job:
          - { variant: rkmpp, nfpm: arm64 }
          - { variant: rpi, nfpm: arm64 }
    env:
      TARGET: aarch64-unknown-linux-gnu
      VARIANT: ${{ matrix.job.variant }}
      CROSS_IMAGE: ghcr.io/binbat/crossbuilder-aarch64-${{ matrix.job.variant }}:latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Build WebUI
        uses: ./.github/actions/build-webui

      - name: Get the release version from the tag
        uses: ./.github/actions/release-version

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}

      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Show version information
        shell: bash
        run: |
          cross --version
          rustup -V
          cargo -V
          rustc -V

      - name: Login to GitHub Container Registry
        shell: bash
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build ${{ matrix.job.variant }} live777
        shell: bash
        run: |
          CROSS_TARGET_AARCH64_UNKNOWN_LINUX_GNU_IMAGE=${CROSS_IMAGE}             cross build --locked --bin live777 --release --target=${TARGET}             --no-default-features --features native-${VARIANT},webui,target-rtp,target-rtsp

      - name: Create ${{ matrix.job.variant }} live777 tarball
        shell: bash
        run: bash scripts/create-release-archive.sh live777 "${TARGET}" "${VERSION}" "target/${TARGET}/release" "" "${VARIANT}"

      - name: Artifact Upload ${{ matrix.job.variant }} live777
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.VERSION }}_${{ env.TARGET }}_${{ env.VARIANT }}_live777
          path: ${{ env.TAR_LIVE777_NAME }}

      - name: Upload ${{ matrix.job.variant }} release archive
        shell: bash
        if: github.ref_type == 'tag'
        run: gh release upload ${{ env.VERSION }} ${{ env.TAR_LIVE777_NAME }}
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Install nFPM
        if: ${{ matrix.job.nfpm }}
        run: |
            echo 'deb [trusted=yes] https://repo.goreleaser.com/apt/ /' | sudo tee /etc/apt/sources.list.d/goreleaser.list
            sudo apt update
            sudo apt install nfpm

      - name: Set nFPM environment
        if: ${{ matrix.job.nfpm }}
        run: |
          DESCRIBE=`git describe --tags`-
          echo "NFPM_NAME=live777-${{ matrix.job.variant }}" >> $GITHUB_ENV
          echo "NFPM_ARCH=${{ matrix.job.nfpm }}" >> $GITHUB_ENV
          echo "NFPM_TARGET=${TARGET}" >> $GITHUB_ENV
          echo "NFPM_VERSION=`echo ${DESCRIBE} | cut -d - -f 1`" >> $GITHUB_ENV
          echo "NFPM_RELEASE=`echo ${DESCRIBE} | cut -d - -f 2`" >> $GITHUB_ENV
          echo "NFPM_PRERELEASE=`echo ${DESCRIBE} | cut -d - -f 3`" >> $GITHUB_ENV

      - name: Build nFPM config
        if: ${{ matrix.job.nfpm }}
        run: envsubst < nfpm/live777.yaml > live777.yaml

      - name: Use nFPM
        if: ${{ matrix.job.nfpm }}
        run: nfpm pkg --packager deb --config live777.yaml

      - name: Artifact Upload deb package
        uses: actions/upload-artifact@v7
        if: ${{ matrix.job.nfpm }}
        with:
          name: ${{ env.VERSION }}_${{ env.TARGET }}_${{ env.VARIANT }}_deb
          path: |
              *.deb

      - name: Upload release deb package
        shell: bash
        if: ${{ (github.ref_type == 'tag') && (matrix.job.nfpm) }}
        run: gh release upload ${{ env.VERSION }} *.deb
        env:
          GH_TOKEN: ${{ github.token }}
