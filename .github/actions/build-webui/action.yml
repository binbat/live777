name: Build WebUI
description: Install pnpm and Node.js, install workspace dependencies, and build all WebUI packages.
runs:
  using: composite
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@v6
    - name: Setup Nodejs
      uses: actions/setup-node@v6
      with:
        node-version: latest
    - name: Install npm dependencies
      shell: bash
      run: pnpm install
    - name: Build WebUI packages
      shell: bash
      run: pnpm -r build
