[package]
name = "livehal"
description = "Native capture / encoder backend for liveion"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["lib"]

[dependencies]
anyhow = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
tracing = { workspace = true, optional = true }
opus-rs = { version = "=0.1.42", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
alsa = { version = "0.12", optional = true }

[build-dependencies]
cc = "1.0"
cmake = "0.1"
pkg-config = "0.3"

[features]
default = []

# --- capture backends (C++ native-pipeline) ---
capture-libcamera = []
capture-v4l2 = []

# --- encoder backends (C++ native-pipeline) ---
encoder-v4l2-m2m = []
encoder-rdk = []
encoder-rkmpp = []
encoder-cedar = []

# --- audio (pure Rust) ---
encoder-opus = ["dep:opus-rs", "dep:tracing"]
capture-alsa = ["encoder-opus", "dep:alsa"]

# future
# encoded-source-waybeam-venc = []
